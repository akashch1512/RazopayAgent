[project]
name = "razopay-agent"
version = "0.1.0"
description = "FastAPI backend for the Razopay LangGraph agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "celery[redis]>=5.4,<6",
    "cryptography>=42,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "email-validator>=2.2,<3",
    "langchain-mcp-adapters>=0.1,<1",
    "langchain-openai>=0.2,<1",
    "langgraph>=0.2,<1",
    "langgraph-checkpoint-postgres>=2,<3",
    "loguru>=0.7,<1",
    "pydantic-settings>=2.6,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-jose[cryptography]>=3.3,<4",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "tenacity>=9.0,<10",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[tool.uv]
default-groups = ["dev"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 119
target-version = "py311"
exclude = ["src/repository/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test", "Acceptance"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short", "--asyncio-mode=auto"]

[project.urls]
homepage = "https://github.com/Aeternalis-Ingenium/DAPSQL-FAQ-Stack-Template"
documentation = "https://github.com/Aeternalis-Ingenium/DAPSQL-FAQ-Stack-Template"
repository = "https://github.com/Aeternalis-Ingenium/DAPSQL-FAQ-Stack-Template"

