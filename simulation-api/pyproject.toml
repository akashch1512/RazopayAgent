[project]
name = "recovery-agent-simulation-api"
version = "0.1.0"
description = "Demo stand-in for paid comms providers (SMS/WhatsApp/call/email/push) - records agent actions and serves them to frontend-demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
