services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_NAME:-razopay_agent}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgresql_db_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_editor:
    image: adminer:4
    restart: unless-stopped
    ports:
      - 8081:8080
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: ./PaymentRecoveryAPI
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      SIMULATION_API_BASE_URL: http://simulation_api:8001/api/v1
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
    volumes:
      - ./PaymentRecoveryAPI:/usr/backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  simulation_api:
    restart: unless-stopped
    build:
      context: ./demo/simulation_api
    ports:
      - "${SIMULATION_API_PORT:-8001}:8001"

  # Agent worker: drains the priority queue by case_id. Each case is claimed by
  # exactly one worker (see `claim_for_processing`), so this scales safely
  # across parallel workers - set CELERY_WORKER_CONCURRENCY in .env (default 4).
  celery_worker:
    restart: unless-stopped
    build:
      context: ./PaymentRecoveryAPI
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
      SIMULATION_API_BASE_URL: http://simulation_api:8001/api/v1
    volumes:
      - ./PaymentRecoveryAPI:/usr/backend
    entrypoint: []
    command:
      - /usr/backend/.venv/bin/celery
      - -A
      - src.workers.celery_app.celery_app
      - worker
      - --queues=webhook_agent
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
      - --prefetch-multiplier=1
      - --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      simulation_api:
        condition: service_started

  # Beat: fires the reconciler (anti-starvation + lost-message recovery).
  celery_beat:
    restart: unless-stopped
    build:
      context: ./PaymentRecoveryAPI
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
    volumes:
      - ./PaymentRecoveryAPI:/usr/backend
    entrypoint: []
    command:
      - /usr/backend/.venv/bin/celery
      - -A
      - src.workers.celery_app.celery_app
      - beat
      - --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./demo/frontend_demo
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgresql_db_data:
  redis_data:
