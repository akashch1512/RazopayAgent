services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_NAME:-razopay_agent}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgresql_db_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_editor:
    image: adminer:4
    restart: unless-stopped
    ports:
      - 8081:8080
    depends_on:
      db:
        condition: service_healthy

  # Redis, the Celery worker and Celery beat all run inside this same container
  # (see PaymentRecoveryAPI/entrypoint.sh), started before uvicorn.
  api:
    restart: unless-stopped
    build:
      context: ./PaymentRecoveryAPI
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: 127.0.0.1
      SIMULATION_API_BASE_URL: http://simulation_api:8001/api/v1
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
    volumes:
      - ./PaymentRecoveryAPI:/usr/backend
      - redis_data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  simulation_api:
    restart: unless-stopped
    build:
      context: ./demo/simulation_api
    ports:
      - "${SIMULATION_API_PORT:-8001}:8001"

  frontend:
    restart: unless-stopped
    build:
      context: ./demo/frontend_demo
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgresql_db_data:
  redis_data:
