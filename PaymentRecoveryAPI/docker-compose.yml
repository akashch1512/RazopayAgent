name: payment-recovery-api

# Self-contained deployment of the Payment Recovery API. A single container runs
# Redis, the Celery agent worker, the Celery beat scheduler and the FastAPI
# server (entrypoint.sh starts Redis + Celery, then execs uvicorn).
#
# PostgreSQL is NOT started here - it is expected to run outside this stack.
# Point the app at it through .env:
#   * managed / remote Postgres -> POSTGRES_HOST=<its hostname>
#   * Postgres on this same machine (host network) -> POSTGRES_HOST=host.docker.internal
#     (the `host-gateway` alias below makes that resolvable on Linux too)

services:
  api:
    build:
      context: .
    image: payment-recovery-api:latest
    env_file:
      - .env
    environment:
      # Redis runs inside this same container.
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command:
      - uvicorn
      - src.main:backend_app
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/api/health").status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  redis_data:
